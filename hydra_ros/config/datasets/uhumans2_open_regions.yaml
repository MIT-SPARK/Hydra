---
input:
  type: RosInput
  inputs:
    left_cam:
      receiver: {type: ImageReceiver, use_exact: true, with_feature: true, queue_size: 30}
      sensor: {type: camera_info, min_range: 0.1, max_range: 5.0, extrinsics: {type: ros, robot_frame: base_link_gt}}
map_window: {type: spatial, max_radius_m: 8.0}
active_window:
  full_update_separation_s: 0.2
  volumetric_map: {voxels_per_side: 16, voxel_size: 0.1, truncation_distance: 0.3}
  tsdf: {semantic_integrator: {type: SingleLabelIntegrator}}
  sinks:
    - type: ReconstructionVisualizer
      point_size: 0.01
      mesh_coloring: {type: UniformMeshColoring, color: [255, 0, 0]}
frontend:
  keyframe_selector:
    verbosity: 2
    max_range_difference_m: 0.5
    sinks:
      - {type: KeyframeVisualizer}
  objects:
    min_cluster_size: 40
    cluster_tolerance: 0.25
    sinks:
      - {type: ObjectVisualizer}
  mesh_compression: {type: MeshCompression, resolution: 0.005}
  traversability_places:
    type: traversability
    layer: PLACES
    estimator: {type: HeightTraversabilityEstimator, height_below: 0, height_above: 0.5, min_confidence: 1.0, min_traversability: 1.0, pessimistic: true}
    clustering: {type: RegionGrowingTraversabilityClustering, max_radius: 2.0, num_orientation_bins: 20}
    sinks:
      - {type: TraversabilityVisualizer}
backend:
  update_functors:
    agents: {type: UpdateAgentsFunctor}
    objects: {type: UpdateObjectsFunctor}
    places: {type: UpdateRegionGrowingTraversabilityFunctor, layer: PLACES}
    regions:
      type: IBRegionsUpdateFunctor
      clustering:
        max_delta: 0.010
        score_threshold: 0.21
        top_k: 2
        cumulative: true
        null_task_preprune: true
        tasks:
          type: RosEmbeddingGroup
          ns: ~/regions
          verbosity: 1
          prompts: [an image of a cubicle group, an image of a hallway, an image of a bathroom, an image of a conference room, an image of a reception area, an image of an office]
  pgmo:
    embed_trajectory_delta_t: 5.0
    num_interp_pts: 3
    interp_horizon: 10.0
    optimizer: {type: KimeraRpgoOptimizer, solver: LM, gnc: {inlier_probability: 0.9, mu_step: 1.6, max_iterations: 100}}
    add_initial_prior: true
    covariance: {odom: 1.0e-02, loop_close: 5.0e-02, sg_loop_close: 1.0e-01, prior: 1.0e-02, mesh_mesh: 1.0e-02, pose_mesh: 1.0e-02, place_mesh: 1.0e-02, place_edge: 10.0, place_merge: 10.0, object_merge: 10.0}
