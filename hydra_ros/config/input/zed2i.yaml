---
map_frame: map
odom_frame: odom
robot_frame: zed_camera_link
robot_id: 0
input:
  inputs:
    frontleft:
      receiver:
        type: ImageReceiver
        semantics_type: closed_set
        queue_size: 30
      sensor:
        type: camera_info
        min_range: 0.4
        max_range: 5.0
        extrinsics:
          type: ros
          sensor_frame: zed_left_camera_frame
map_window:
  type: spatial
  max_radius_m: 8.0
active_window:
  volumetric_map:
    voxels_per_side: 16
    voxel_size: 0.1
    truncation_distance: 0.3
  tsdf:
    semantic_integrator:
      type: MLESemanticIntegrator
frontend:
  type: GraphBuilder
  graph_connector:
    layers:
      - {parent_layer: MESH_PLACES}
  mesh_compression: {resolution: 0.005}
  objects:
    min_cluster_size: 40
    cluster_tolerance: 0.25
    bounding_box_type: AABB
  surface_places:
    type: place_2d
    pure_final_place_size: 3
    cluster_tolerance: 0.3
    min_cluster_size: 50
    max_cluster_size: 100000
    min_final_place_points: 10
    place_max_neighbor_z_diff: 0.5
    place_overlap_threshold: 0.0
  deformation_graph_builder: {horizon_s: 15.0, resolution: 2.5}
  graph_updater:
    layer_updates:
      OBJECTS: {prefix: O}
      MESH_PLACES: {prefix: P}
backend:
  type: BackendModule
  serialize_dsg_mesh: false
  min_dsg_separation_s: 1
  publish_mesh: true
  min_mesh_separation_s: 10
  optimize_on_lc: true
  update_functors:
    agents: {type: UpdateAgentsFunctor}
    objects: {type: UpdateObjectsFunctor}
    surface_places: {type: Update2dPlacesFunctor}
  pgmo:
    run_mode: FULL
    num_interp_pts: 3
    interp_horizon: 10.0
    add_initial_prior: true
    optimizer:
      type: KimeraRpgoOptimizer
      solver: LM
      gnc:
        inlier_probability: 0.9
        mu_step: 1.6
        max_iterations: 100
    covariance:
      odom: 1.0e-02
      loop_close: 5.0e-02
      prior: 1.0e-02
      mesh_mesh: 1.0e-02
      pose_mesh: 1.0e-02
  publish_backend_tf: true
  optimization_hooks: []
