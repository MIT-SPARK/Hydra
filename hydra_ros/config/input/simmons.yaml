---
input:
  inputs:
    camera:
      receiver:
        type: ImageReceiver
        semantics_type: closed_set
        queue_size: 30
      sensor:
        type: camera_info
        min_range: $<var sensor_min_range>
        max_range: $<var sensor_max_range>
        extrinsics:
          type: kimera
          sensor_filepath: $<var kimera_sensor_filepath>
