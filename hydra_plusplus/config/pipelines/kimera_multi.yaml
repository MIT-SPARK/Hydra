---
labelspace: {type: from_msg}
active_window:
  volumetric_map: {voxels_per_side: 16, voxel_size: 0.1, truncation_distance: 0.3, with_semantics: true}
frontend:
  publish_mesh: false
  serialize_dsg_mesh: false
  mesh_compression: {resolution: 0.05}
  surface_places: {type: place_2d, pure_final_place_size: 5.0, cluster_tolerance: 0.3, min_cluster_size: 10, min_final_place_points: 10, place_overlap_threshold: 0.0}
  graph_connector:
    layers:
      - {parent_layer: MESH_PLACES, child_layers: [layer: OBJECTS]}
  deformation_graph_builder: {horizon_s: 100.0, resolution: 2.5}
  pose_graph_tracker: {min_pose_separation: 1.0, rotation_separation_weight: 1.0, min_time_separation_s: 5.0}
  graph_updater:
    layer_updates:
      OBJECTS: {prefix: O}
      MESH_PLACES: {prefix: P}
backend:
  serialize_dsg_mesh: false
  min_dsg_separation_s: 2
  min_mesh_separation_s: 2
  publish_mesh: false
  update_functors:
    agents: {type: UpdateAgentsFunctor}
    objects: {type: UpdateObjectsFunctor}
    surface_places: {type: Update2dPlacesFunctor}
  pgmo:
    optimizer: {type: KimeraRpgoOptimizer, gnc: {inlier_probability: 0.9, mu_step: 1.6, max_iterations: 100}}
    covariance:
      odom: 1.0e-02
      loop_close: 5.0e-02
      prior: 1.0e-02
      mesh_mesh: 1.0e-02
      pose_mesh: 1.0e-02
  optimization_hooks: []
