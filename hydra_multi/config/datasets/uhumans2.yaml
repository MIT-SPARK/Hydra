---
backend:
  type: MultiBackendModule
  add_objects_to_deformation_graph: false
  add_places_to_deformation_graph: false
  optimize_on_lc: true
  dsg_update:
    enable_node_merging: true
    update_functors:
      agents:
        type: UpdateAgentsFunctor
      objects:
        type: UpdateObjectsFunctor
      surface_places:
        type: Update2dPlacesFunctor
      places:
        type: UpdatePlacesFunctor
      rooms:
        type: UpdateRoomsFunctor
        room_finder:
          min_dilation_m: 0.5
          max_dilation_m: 1.2
          min_component_size: 10
          min_room_size: 10
          dilation_threshold_mode: PLATEAU
          min_lifetime_length_m: 0.1
          plateau_ratio: 0.15
          clustering_mode: NEIGHBORS
          dilation_diff_threshold_m: -1.0
      buildings:
        type: UpdateBuildingsFunctor
      zmq_labels:
        type: ZmqRoomLabelUpdater
  initial_align:
    type: LoopClosureInitialAlign
    alignment_gnc_alpha: 0.7
    rot_sigma: 0.1
    trans_sigma: 10.0
  pgmo:
    run_mode: FULL  # kimera_pgmo run mode FULL is required
    embed_trajectory_delta_t: 5.0
    num_interp_pts: 3
    interp_horizon: 10.0
    enable_sparsify: false
    trans_node_dist: 1.0
    rot_node_dist: 1.2
    optimizer:
      type: KimeraRpgoOptimizer
      solver: LM
      gnc:
        inlier_probability: 0.9
        mu_step: 1.6
        max_iterations: 100
    covariance:
      odom: 1.0e-02
      loop_close: 5.0e-02
      sg_loop_close: 1.0e-01
      prior: 1.0e-02
      mesh_mesh: 1.0e-02
      pose_mesh: 1.0e-02
      place_mesh: 1.0e-02
      place_edge: 10.0
      place_merge: 10.0
      object_merge: 10.0
