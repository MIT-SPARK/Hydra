---
session_name: test-jackals-multi-session
environment:
  BAG_PATH: /media/yunchang/YUN_SanDisk_4/dcist_mit/sparkal2_2023-09-28-16-46-05.bag
  KIMERA_WS: /home/yunchang/catkin_ws
  OUTPUT_PATH: /home/yunchang/logs/hydra_multi/dcist_mit_load
  INPUT_PATH: /home/yunchang/logs/hydra_multi/dcist_mit_prev
  SENSOR_FRAME: foward_color_optical_frame
  LABELSPACE: ade20k_mit
  RATE: '1.0'
  ROBOT_NAME: sparkal2
  ROBOT_ID: '3'
  ROBOT_PREV: sparkal2_prev
  PREV_ID: '7'
options:
  default-command: /bin/bash
windows:
  - window_name: hydra_multi
    focus: true
    layout: tiled
    shell_command_before: [source $KIMERA_WS/devel/setup.bash, cd $OUTPUT_PATH; rm -rf *; mkdir -p $OUTPUT_PATH/$ROBOT_NAME; mkdir -p $OUTPUT_PATH/$ROBOT_PREV]
    panes:
      - roslaunch hydra_multi_ros lc_module_robot.launch robot_id:=$PREV_ID robot_name:=$ROBOT_PREV save_lcd_frames:=false output_dir:=$OUTPUT_PATH/$ROBOT_PREV load_visual_lc_session:=true visual_lc_session_dir:=$INPUT_PATH/$ROBOT_PREV
      - sleep 10; rosrun hydra_multi_ros load_srv.py /hydra_multi_node/load $PREV_ID $INPUT_PATH/$ROBOT_PREV/hydra
      - roslaunch kimera_core hydra_vio_jackal.launch robot_id:=$ROBOT_ID robot_name:=$ROBOT_NAME use_lidar_external:=false
      - roslaunch hydra_ros phoenix.launch robot_id:=$ROBOT_ID robot_name:=$ROBOT_NAME sensor_frame:=$ROBOT_NAME/$SENSOR_FRAME odom_frame:=$ROBOT_NAME/odom labelspace_name:=$LABELSPACE semantic_map_file:=$LABELSPACE.csv
        dsg_output_dir:=$OUTPUT_PATH/$ROBOT_NAME use_zmq_interface:=false
      - roslaunch hydra_multi_ros lc_module_robot.launch robot_id:=$ROBOT_ID robot_name:=$ROBOT_NAME save_lcd_frames:=true output_dir:=$OUTPUT_PATH/$ROBOT_NAME
      - sleep 5; rosbag play $BAG_PATH --topics /$ROBOT_NAME/forward/color/image_raw/compressed /$ROBOT_NAME/forward/color/image_rect_color/compressed /$ROBOT_NAME/forward/color/camera_info /$ROBOT_NAME/forward/depth/image_rect_raw
        /$ROBOT_NAME/forward/depth/camera_info /$ROBOT_NAME/forward/imu /$ROBOT_NAME/jackal_velocity_controller/odom /tf_static
      - roslaunch hydra_multi_ros hydra_multi_dcist.launch enable_dsg_lcd:=false start_visualizer:=true output_dir:=$OUTPUT_PATH num_robots:=8
